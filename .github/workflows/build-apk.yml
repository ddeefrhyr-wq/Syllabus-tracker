name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Release v1.0.0 (Build ${{ github.run_number }}.${{ github.run_attempt }})"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Creating GitHub Release ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${APK_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --latest \
            --notes "### Build ${RELEASE_TAG}

          - **Commit**: \`${GITHUB_SHA}\`
          - **Run Number**: \`${{ github.run_number }}\`
          - **Run Attempt**: \`${{ github.run_attempt }}\`

          Download the verified debug APK directly from the Assets section below:
          - \`app-debug.apk\`"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          APK_FILENAME="app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            gh release view "${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            RELEASE_TITLE=$(gh release view "${RELEASE_TAG}" --json title --jq .title)
            echo "Release Title: ${RELEASE_TITLE}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq .url)
            echo "Direct GitHub Release URL: ${RELEASE_URL}"
            echo "Exact APK Asset Filename: ${APK_FILENAME}"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## :white_check_mark: APK Build & Release Succeeded

          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Release Title:** ${RELEASE_TITLE}
          - **Direct Release Page:** [View Release](${RELEASE_URL})
          - **Exact APK Asset:** \`${APK_FILENAME}\`

          ### Download Instructions
          The APK can be downloaded directly from the **Assets** section of the release page:
          - [Download ${APK_FILENAME}](${RELEASE_URL})

          > **Backup Artifact:** The standard Actions artifact named \`app-debug-apk\` is also available from this workflow run.
          EOF
          else
            echo "::warning::GitHub Release publishing failed. However, the APK build and artifact upload succeeded!"
            echo "Status: APK build succeeded."
            echo "Artifact: The Actions artifact named 'app-debug-apk' remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## :warning: APK Build Succeeded (Release Publishing Failed)

          - **APK Build Status:** Succeeded
          - **Actions Artifact:** The artifact named \`app-debug-apk\` remains available.

          > **Notice:** Release publishing encountered an issue and did not publish the release. You can download the verified APK directly from the Actions artifact named **app-debug-apk** in this workflow run.
          EOF
          fi
