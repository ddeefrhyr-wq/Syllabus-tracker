<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Purple Gradient -->
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Planner Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Header Accent Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Emerald Checkmark Badge Gradient -->
    <linearGradient id="checkBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Depth Shadows -->
    <filter id="cardShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.38" />
    </filter>

    <filter id="badgeShadow" x="-25%" y="-25%" width="155%" height="155%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.42" />
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Container Background with Vibrant Purple Gradient -->
  <rect width="512" height="512" rx="112" fill="url(#purpleBg)" />
  
  <!-- Subtle High-end Inner Sheen Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- Study Planner / Calendar Card -->
  <g filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect x="120" y="76" width="272" height="264" rx="28" fill="url(#sheetGrad)" />

    <!-- Calendar / Planner Top Header Banner -->
    <path d="M 120 104 C 120 88.5 132.5 76 148 76 L 364 76 C 379.5 76 392 88.5 392 104 L 392 136 L 120 136 Z" fill="url(#headerGrad)" />

    <!-- Header Calendar Month / Dot Grid Motif -->
    <circle cx="160" cy="106" r="4" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="178" cy="106" r="4" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="196" cy="106" r="4" fill="#ffffff" fill-opacity="0.85" />

    <line x1="316" y1="106" x2="352" y2="106" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Planner Spiral Binder Rings -->
    <!-- Ring 1 -->
    <rect x="154" y="62" width="14" height="26" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="156" y="64" width="10" height="8" rx="4" fill="#ffffff" />
    <!-- Ring 2 -->
    <rect x="212" y="62" width="14" height="26" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="214" y="64" width="10" height="8" rx="4" fill="#ffffff" />
    <!-- Ring 3 -->
    <rect x="286" y="62" width="14" height="26" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="288" y="64" width="10" height="8" rx="4" fill="#ffffff" />
    <!-- Ring 4 -->
    <rect x="344" y="62" width="14" height="26" rx="7" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="346" y="64" width="10" height="8" rx="4" fill="#ffffff" />

    <!-- Planner Checklist Items Inside Sheet -->
    <!-- Task Item 1 (Completed) -->
    <g transform="translate(148, 164)">
      <!-- Checkbox Circle -->
      <circle cx="14" cy="14" r="13" fill="#10b981" />
      <polyline points="8,14 12.5,18.5 20,10" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Content Bar -->
      <rect x="38" y="7" width="146" height="14" rx="7" fill="#cbd5e1" />
    </g>

    <!-- Task Item 2 (Completed) -->
    <g transform="translate(148, 208)">
      <!-- Checkbox Circle -->
      <circle cx="14" cy="14" r="13" fill="#10b981" />
      <polyline points="8,14 12.5,18.5 20,10" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Content Bar -->
      <rect x="38" y="7" width="124" height="14" rx="7" fill="#cbd5e1" />
    </g>

    <!-- Task Item 3 (In Progress / Active) -->
    <g transform="translate(148, 252)">
      <!-- Checkbox Circle -->
      <circle cx="14" cy="14" r="13" fill="#ffffff" stroke="#a78bfa" stroke-width="3" />
      <circle cx="14" cy="14" r="5" fill="#8b5cf6" />
      <!-- Content Bar -->
      <rect x="38" y="7" width="96" height="14" rx="7" fill="#e2e8f0" />
    </g>
  </g>

  <!-- Hero Milestone Checkmark Badge -->
  <g filter="url(#badgeShadow)">
    <!-- Badge Background Circle with Crisp White Border -->
    <circle cx="348" cy="298" r="46" fill="url(#checkBadgeGrad)" stroke="#ffffff" stroke-width="6.5" />
    <!-- Dynamic Bold Checkmark -->
    <path d="M 326 298 L 341 313 L 372 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Decorative Sparkle / Star (Top-right of badge) -->
  <path d="M 386 242 L 389 252 L 399 255 L 389 258 L 386 268 L 383 258 L 373 255 L 383 252 Z" fill="#fbbf24" opacity="0.95" />

  <!-- Clean Bottom Title Text: "Study Tracker" (No batch subtitles) -->
  <text
    x="256"
    y="442"
    text-anchor="middle"
    fill="#ffffff"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="1.2"
    filter="url(#textShadow)"
  >
    Study Tracker
  </text>
</svg>
